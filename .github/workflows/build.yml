
name: Build EveryKeyJump

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: EveryKeyJump
          path: ${{ steps.build.outputs.build-output }}/*.geode
